replicaCount: 2

image:
  repository: 962765734677.dkr.ecr.us-east-1.amazonaws.com/eks-gitops/api-service
  pullPolicy: IfNotPresent
  tag: "22902b509854dc7b4219148b90a3379868edba5c"

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

serviceAccount:
  create: true
  name: "api-service-sa"
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::962765734677:role/eks-gitops-platform-api-service"

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1001
  fsGroup: 1001

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop: ["ALL"]

env:
  SQS_QUEUE_URL: "https://sqs.us-east-1.amazonaws.com/962765734677/order-processing-queue"
  DYNAMODB_TABLE: "order-storage-table"

livenessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 15

readinessProbe:
  httpGet:
    path: /health
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10