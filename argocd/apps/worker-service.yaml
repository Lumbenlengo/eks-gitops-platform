apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: worker-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Lumbenlengo/eks-gitops-platform.git
    targetRevision: HEAD
    path: helm-charts/worker-service
  destination:
    server: https://kubernetes.default.svc
    namespace: worker-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true 