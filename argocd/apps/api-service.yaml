apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: api-service
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Lumbenlengo/eks-gitops-platform.git
    targetRevision: HEAD
    path: helm-charts/api-service
  destination:
    server: https://kubernetes.default.svc
    namespace: api-service
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - Replace=true
