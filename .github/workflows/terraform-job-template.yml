name: "Terraform Job Template"

on:
  workflow_call:
    inputs:
      layer:
        type: string
        required: true
      tf_key:
        type: string
        required: true
      action:
        type: string
        default: "apply"

jobs:
  terraform:
    name: "Terraform ${{ inputs.action }} — ${{ inputs.layer }}"
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/layers/${{ inputs.layer }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=eks-gitops-platform-tfstate-${{ secrets.AWS_ACCOUNT_ID }}" \
            -backend-config="key=${{ inputs.tf_key }}" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform Plan
        working-directory: terraform/layers/${{ inputs.layer }}
        run: |
          TFVARS_PATH="${{ github.workspace }}/terraform/environments/prod/terraform.tfvars"

          if [ "${{ inputs.action }}" == "destroy" ]; then
            terraform plan -destroy -lock-timeout=10m -input=false -out=tfplan \
              -compact-warnings -var-file="$TFVARS_PATH"
          else
            terraform plan -lock-timeout=10m -input=false -out=tfplan \
              -compact-warnings -var-file="$TFVARS_PATH"
            terraform show -json tfplan > plan.json
            if jq -e '.resource_changes[]? | select(.change.actions[] == "delete")' plan.json; then
              echo "::error::Destroy operations detected in plan! Failing to prevent accidental deletion."
              exit 1
            fi
          fi

      - name: Terraform Apply
        working-directory: terraform/layers/${{ inputs.layer }}
        run: terraform apply -input=false -auto-approve tfplan