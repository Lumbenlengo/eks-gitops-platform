name: "Terraform — Full Stack Deployment"

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      layer:
        description: 'Layer to process (e.g., 01-foundation)'
        required: true
        default: '01-foundation'
      action:
        description: 'Action to perform'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

permissions: { id-token: write, contents: read }
concurrency: { group: terraform-prod, cancel-in-progress: false }

jobs:
  lint:
    name: "Repository Linting"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive .

  # Note: To run specific layers, update the 'needs' or run manually per job
  foundation:
    needs: [lint]
    uses: ./.github/workflows/terraform-job-template.yml
    with:
      layer: ${{ github.event.inputs.layer || '01-foundation' }}
      tf_key: "foundation/terraform.tfstate"
      action: ${{ github.event.inputs.action || 'apply' }}
    secrets: inherit
