name: "Terraform Destroy Layer"

on:
  workflow_dispatch:
    inputs:
      layer:
        description: 'Layer to destroy'
        required: true
        type: choice
        options:
          - 00-bootstrap
          - 01-foundation
          - 02-platform
          - 03-addons

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-prod
  cancel-in-progress: false

jobs:
  destroy:
    name: "Destroy ${{ inputs.layer }}"
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/layers/${{ inputs.layer }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=eks-gitops-platform-tfstate-${{ secrets.AWS_ACCOUNT_ID }}" \
            -backend-config="key=${{ inputs.layer }}/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION }}"

      - name: Terraform Destroy
        working-directory: terraform/layers/${{ inputs.layer }}
        run: |
          terraform destroy \
            -input=false \
            -auto-approve \
            -var-file="../../environments/prod/terraform.tfvars"
