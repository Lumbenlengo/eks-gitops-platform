name: "Terraform — Full Stack Deployment"

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions: { id-token: write, contents: read }
concurrency: { group: terraform-prod, cancel-in-progress: false }

jobs:
  lint:
    name: "Repository Linting"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive .

  bootstrap:
    needs: [lint]
    uses: ./.github/workflows/terraform-job-template.yml
    with:
      layer: "00-bootstrap"
      tf_key: "bootstrap/terraform.tfstate"
    secrets: inherit

  foundation:
    needs: [bootstrap]
    uses: ./.github/workflows/terraform-job-template.yml
    with:
      layer: "01-foundation"
      tf_key: "foundation/terraform.tfstate"
    secrets: inherit

  platform:
    needs: [foundation]
    uses: ./.github/workflows/terraform-job-template.yml
    with:
      layer: "02-platform"
      tf_key: "platform/terraform.tfstate"
    secrets: inherit

  addons:
    needs: [platform]
    uses: ./.github/workflows/terraform-job-template.yml
    with:
      layer: "03-addons"
      tf_key: "addons/terraform.tfstate"
    secrets: inherit