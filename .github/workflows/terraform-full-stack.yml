name: "Full Stack Deployment"

on:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:
    inputs:
      action:
        description: 'Terraform action'
        required: true
        default: 'apply'
        type: choice
        options:
          - apply
          - destroy

permissions:
  id-token: write
  contents: write

concurrency:
  group: terraform-prod
  cancel-in-progress: false

env:
  AWS_REGION: "us-east-1"

jobs:
  lint:
    name: "Lint"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive .

  bootstrap:
    name: "Terraform — 00-bootstrap"
    needs: [lint]
    uses: ./.github/workflows/terraform-job-template.yml
    with:
      layer: "00-bootstrap"
      tf_key: "bootstrap/terraform.tfstate"
      action: ${{ github.event.inputs.action || 'apply' }}
    secrets: inherit

  foundation:
    name: "Terraform — 01-foundation"
    needs: [bootstrap]
    uses: ./.github/workflows/terraform-job-template.yml
    with:
      layer: "01-foundation"
      tf_key: "foundation/terraform.tfstate"
      action: ${{ github.event.inputs.action || 'apply' }}
    secrets: inherit

  platform:
    name: "Terraform — 02-platform"
    needs: [foundation]
    uses: ./.github/workflows/terraform-job-template.yml
    with:
      layer: "02-platform"
      tf_key: "platform/terraform.tfstate"
      action: ${{ github.event.inputs.action || 'apply' }}
    secrets: inherit

  addons:
    name: "Terraform — 03-addons"
    needs: [platform]
    uses: ./.github/workflows/terraform-job-template.yml
    with:
      layer: "03-addons"
      tf_key: "addons/terraform.tfstate"
      action: ${{ github.event.inputs.action || 'apply' }}
    secrets: inherit

  docker-api:
    name: "Docker — api-service"
    needs: [bootstrap, addons]
    if: ${{ github.event.inputs.action != 'destroy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.bootstrap.outputs.ecr_push_role_arn || secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push api-service
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_REPOSITORY_API || 'api-service' }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPO:$TAG -t $REGISTRY/$REPO:latest app/api-service
          docker push $REGISTRY/$REPO:$TAG
          docker push $REGISTRY/$REPO:latest

      - name: Update api-service Helm values
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_REPOSITORY_API || 'api-service' }}
          TAG: ${{ github.sha }}
        run: |
          sed -i "s|repository:.*|repository: $REGISTRY/$REPO|" helm-charts/api-service/values.yaml
          sed -i "s|tag:.*|tag: \"$TAG\"|"                       helm-charts/api-service/values.yaml

      - name: Commit Helm values
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm-charts/api-service/values.yaml
          git diff --staged --quiet || (
            git commit -m "day 4: update api-service image → ${{ github.sha }}" &&
            git pull --rebase origin main &&
            git push
          )

  docker-worker:
    name: "Docker — worker-service"
    needs: [bootstrap, docker-api]
    if: ${{ github.event.inputs.action != 'destroy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.bootstrap.outputs.ecr_push_role_arn || secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build & Push worker-service
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_REPOSITORY_WORKER || 'worker-service' }}
          TAG: ${{ github.sha }}
        run: |
          docker build -t $REGISTRY/$REPO:$TAG -t $REGISTRY/$REPO:latest app/worker-service
          docker push $REGISTRY/$REPO:$TAG
          docker push $REGISTRY/$REPO:latest

      - name: Update worker-service Helm values
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPO: ${{ secrets.ECR_REPOSITORY_WORKER || 'worker-service' }}
          TAG: ${{ github.sha }}
        run: |
          sed -i "s|repository:.*|repository: $REGISTRY/$REPO|" helm-charts/worker-service/values.yaml
          sed -i "s|tag:.*|tag: \"$TAG\"|"                       helm-charts/worker-service/values.yaml

      - name: Commit Helm values
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm-charts/worker-service/values.yaml
          git diff --staged --quiet || (
            git commit -m "day 4: update worker-service image → ${{ github.sha }}" &&
            git pull --rebase origin main &&
            git push
          )

  argocd-sync:
    name: "ArgoCD Sync"
    needs: [bootstrap, platform, docker-worker]
    if: ${{ github.event.inputs.action != 'destroy' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ needs.bootstrap.outputs.ecr_push_role_arn || secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get EKS kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name ${{ needs.platform.outputs.cluster_name || secrets.EKS_CLUSTER_NAME }} \
            --region ${{ env.AWS_REGION }}

      - name: Apply ArgoCD projects
        run: kubectl apply -f argocd/projects/

      - name: Apply ArgoCD apps
        run: kubectl apply -f argocd/apps/