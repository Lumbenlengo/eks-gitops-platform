name: Terraform — 4 Layer Pipeline

on:
  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches:
      - main
    paths:
      - "terraform/**"

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION:     us-east-1
  AWS_ACCOUNT_ID: "962765734677"
  TF_VERSION:     "1.7.5"
  BACKEND_ENV:    "prod"

permissions:
  id-token:      write
  contents:      read
  pull-requests: write

jobs:
  bootstrap:
    name: "Layer 00 — Bootstrap"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-tf-bootstrap-${{ github.run_id }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Init
        working-directory: terraform/layers/00-bootstrap
        run: |
          terraform init -input=false \
            -backend-config=../../environments/${{ env.BACKEND_ENV }}/bootstrap.tfvars
      - name: Terraform Plan
        working-directory: terraform/layers/00-bootstrap
        run: terraform plan -no-color -input=false -out=tfplan
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: terraform/layers/00-bootstrap
        run: terraform apply -no-color -auto-approve tfplan

  foundation:
    name: "Layer 01 — Foundation"
    runs-on: ubuntu-latest
    needs: bootstrap
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-tf-foundation-${{ github.run_id }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Init
        working-directory: terraform/layers/01-foundation
        run: |
          terraform init -input=false \
            -backend-config=../../environments/${{ env.BACKEND_ENV }}/foundation.tfvars
      - name: Terraform Plan
        working-directory: terraform/layers/01-foundation
        run: terraform plan -no-color -input=false -out=tfplan
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: terraform/layers/01-foundation
        run: terraform apply -no-color -auto-approve tfplan

  platform:
    name: "Layer 02 — Platform"
    runs-on: ubuntu-latest
    needs: foundation
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-tf-platform-${{ github.run_id }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Init
        working-directory: terraform/layers/02-platform
        run: |
          terraform init -input=false \
            -backend-config=../../environments/${{ env.BACKEND_ENV }}/platform.tfvars
      - name: Terraform Plan
        working-directory: terraform/layers/02-platform
        run: terraform plan -no-color -input=false -out=tfplan
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: terraform/layers/02-platform
        run: terraform apply -no-color -auto-approve tfplan

  addons:
    name: "Layer 03 — Addons"
    runs-on: ubuntu-latest
    needs: platform
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-tf-addons-${{ github.run_id }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Terraform Init
        working-directory: terraform/layers/03-addons
        run: |
          terraform init -input=false \
            -backend-config=../../environments/${{ env.BACKEND_ENV }}/addons.tfvars
      - name: Terraform Plan
        working-directory: terraform/layers/03-addons
        run: terraform plan -no-color -input=false -out=tfplan
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        working-directory: terraform/layers/03-addons
        run: terraform apply -no-color -auto-approve tfplan

  summary:
    name: Pipeline Summary
    runs-on: ubuntu-latest
    needs: [bootstrap, foundation, platform, addons]
    if: always()
    steps:
      - name: Report status
        run: |
          echo "## 🏗️ Terraform 4-Layer Pipeline" >> $GITHUB_STEP_SUMMARY
          echo "| Layer | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 00 Bootstrap  | ${{ needs.bootstrap.result }}  |" >> $GITHUB_STEP_SUMMARY
          echo "| 01 Foundation | ${{ needs.foundation.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 02 Platform   | ${{ needs.platform.result }}   |" >> $GITHUB_STEP_SUMMARY
          echo "| 03 Addons     | ${{ needs.addons.result }}     |" >> $GITHUB_STEP_SUMMARY
