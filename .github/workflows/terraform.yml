name: "Terraform — 4 Layer Pipeline"
on:
  push:
    branches: [ main ]
env:
  AWS_REGION:      us-east-1
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  TF_VERSION:      "1.7.5"
  BACKEND_ENV:     "prod"
permissions:
  id-token: write
  contents: read
jobs:
  detect-changes:
    name: "Detect Changed Layers"
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.changes.outputs.apps }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: changes
        run: |
          echo "apps=true" >> $GITHUB_OUTPUT
  apps:
    name: "Layer 03 — Apps"
    runs-on: ubuntu-latest
    needs: [detect-changes]
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      - name: Init
        working-directory: terraform/layers/03-addons
        run: terraform init -input=false -backend-config=../../environments/${{ env.BACKEND_ENV }}/addons.tfvars
      - name: Plan
        working-directory: terraform/layers/03-addons
        run: |
          terraform plan -no-color -input=false \
            -var="cluster_name=" -var="cluster_endpoint=" -var="cluster_ca_cert=" \
            -var-file=../../environments/${{ env.BACKEND_ENV }}/terraform.tfvars \
            -out=tfplan
      - name: Apply
        working-directory: terraform/layers/03-addons
        run: terraform apply -no-color -auto-approve tfplan
