name: Terraform — 4 Layer Pipeline

on:
  push:
    branches: [ main ]
    paths: ["terraform/**", ".github/workflows/terraform.yml"]
  pull_request:
    branches: [ main ]
    paths: ["terraform/**"]

env:
  AWS_REGION:     us-east-1
  AWS_ACCOUNT_ID: "962765734677"
  TF_VERSION:     "1.7.5"
  BACKEND_ENV:    "prod"

permissions:
  id-token: write
  contents: read

jobs:
  bootstrap:
    name: "Layer 00 — Bootstrap"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Terraform Init
        working-directory: terraform/layers/00-bootstrap
        run: |
          terraform init -input=false \
            -backend-config=../../environments/${{ env.BACKEND_ENV }}/bootstrap.tfvars
      
      - name: Terraform Plan
        working-directory: terraform/layers/00-bootstrap
        run: |
          terraform plan -no-color -input=false \
            -var-file=../../environments/${{ env.BACKEND_ENV }}/terraform.tfvars \
            -out=tfplan
      
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        working-directory: terraform/layers/00-bootstrap
        run: terraform apply -no-color -auto-approve tfplan

  foundation:
    name: "Layer 01 — Foundation"
    runs-on: ubuntu-latest
    needs: bootstrap
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/github-actions-terraform
          aws-region: ${{ env.AWS_REGION }}
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
      
      - name: Terraform Init
        working-directory: terraform/layers/01-foundation
        run: |
          terraform init -input=false \
            -backend-config=../../environments/${{ env.BACKEND_ENV }}/foundation.tfvars
      
      - name: Terraform Plan
        working-directory: terraform/layers/01-foundation
        run: |
          terraform plan -no-color -input=false \
            -var-file=../../environments/${{ env.BACKEND_ENV }}/terraform.tfvars \
            -out=tfplan
      
      - name: Terraform Apply
        if: github.ref == 'refs/heads/main'
        working-directory: terraform/layers/01-foundation
        run: terraform apply -no-color -auto-approve tfplan
